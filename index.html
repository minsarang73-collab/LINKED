<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미담</title>
<meta name="description" content="모임별 사람과 명함, 만남에서 먹은 음식과 와인, 주고받은 선물을 휴대폰에 기억하는 미담 앱">
<meta name="theme-color" content="#f7f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160a0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미담">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Layout: one phone column (max 520px) — 명조 headings on cream paper, wine hero cards, fixed bottom tab bar */
  --bg:#f7f0e6; --surface:#fffcf7; --surface-2:#f1e7d7; --ink:#2a2320; --ink-soft:#6b615a; --line:#e6dccb;
  --accent:#5c1f2e; --btn:#5c1f2e; --btn-fg:#f8f2e9;
  --hero-1:#5c1f2e; --hero-2:#3f1420; --on-hero:#f8f2e9; --on-hero-soft:#e8dad3; --hero-gold:#d9c19a;
  --gold:#94713a; --gold-bg:rgba(184,147,90,.16); --gold-line:#d9c19a;
  --warn-bg:#fbe8e2; --warn-fg:#962f22; --ok-fg:#3d6a53;
  --tab-bg:rgba(255,252,247,.94); --scrim:rgba(24,9,14,.62); --shadow:0 10px 28px rgba(92,31,46,.08);
  --f-display:'Nanum Myeongjo','AppleMyungjo','Noto Serif KR',serif;
  --f-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160a0e; --surface:#211218; --surface-2:#2c1820; --ink:#f2e8df; --ink-soft:#bba99f; --line:#3a242d;
    --accent:#e6a9b6; --btn:#8b3247; --btn-fg:#fbf3ec;
    --hero-1:#5a1e2d; --hero-2:#2a0c15; --on-hero:#f8f2e9; --on-hero-soft:#e1d0c8; --hero-gold:#dcc49c;
    --gold:#d8b57c; --gold-bg:rgba(216,181,124,.14); --gold-line:#6e5634;
    --warn-bg:#3b1a16; --warn-fg:#f2ab9c; --ok-fg:#8fc3a6;
    --tab-bg:rgba(26,13,18,.94); --scrim:rgba(0,0,0,.72); --shadow:0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160a0e; --surface:#211218; --surface-2:#2c1820; --ink:#f2e8df; --ink-soft:#bba99f; --line:#3a242d;
  --accent:#e6a9b6; --btn:#8b3247; --btn-fg:#fbf3ec;
  --hero-1:#5a1e2d; --hero-2:#2a0c15; --on-hero:#f8f2e9; --on-hero-soft:#e1d0c8; --hero-gold:#dcc49c;
  --gold:#d8b57c; --gold-bg:rgba(216,181,124,.14); --gold-line:#6e5634;
  --warn-bg:#3b1a16; --warn-fg:#f2ab9c; --ok-fg:#8fc3a6;
  --tab-bg:rgba(26,13,18,.94); --scrim:rgba(0,0,0,.72); --shadow:0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
img.broken{visibility:hidden}

#app{max-width:520px;margin:0 auto}
#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(108px + env(safe-area-inset-bottom,0px))}
body.no-tab #view{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* headings */
.head{padding-top:14px;display:flex;flex-direction:column;gap:4px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:11px;letter-spacing:2.4px;color:var(--gold);text-transform:uppercase;font-weight:700}
.h-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.35;color:var(--ink);text-wrap:balance}
.h-sub{margin:2px 0 0;font-size:13px;color:var(--ink-soft);font-weight:300}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.icon-btn:active{background:var(--surface-2)}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-label{margin:0;font-size:12.5px;letter-spacing:1px;color:var(--ink-soft);font-weight:700}
.sec-link{font-size:12.5px;color:var(--accent);font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(155deg,var(--hero-1) 0%,var(--hero-2) 100%);color:var(--on-hero);border:0;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-gold)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:1px solid rgba(217,193,154,.18)}
.hero-title{margin:6px 0 0;font-family:var(--f-display);font-size:21px;font-weight:800;line-height:1.4}
.hero-text{margin:8px 0 0;font-size:13.5px;line-height:1.75;color:var(--on-hero-soft);font-weight:300}
.hero-text b{color:var(--hero-gold);font-weight:500}

.quiet{background:var(--gold-bg);border:1px dashed var(--gold-line);border-radius:16px;padding:12px 15px;font-size:13px;line-height:1.7;color:var(--ink)}
.quiet b{color:var(--accent)}
.hint{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6;display:flex;gap:6px;align-items:flex-start}
.hint svg{width:16px;height:16px;margin-top:2px;color:var(--gold)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 11px;border-radius:30px;background:var(--surface-2);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.gold{background:var(--gold-bg);color:var(--gold)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.hero .chip{background:rgba(255,255,255,.12);color:var(--hero-gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
button.chip{border:1px solid transparent;font-size:13px;padding:7px 13px}
button.chip.on{background:var(--btn);color:var(--btn-fg)}
button.chip.add{background:transparent;border:1px dashed var(--gold-line);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:15px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:14.5px;letter-spacing:.3px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.gold{background:linear-gradient(120deg,#b8935a,#a07a42);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.hero .btn.ghost{border-color:rgba(217,193,154,.6);color:var(--hero-gold)}
.btn.small{padding:10px 12px;font-size:13px;border-radius:12px}
.btn.danger{background:transparent;border:1.5px solid var(--warn-fg);color:var(--warn-fg)}
.btn[disabled]{opacity:.55}
.btn-row{display:flex;gap:8px}
.btn-row>*{flex:1;min-width:0}

/* avatar */
.av{border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;color:#fff;overflow:hidden;background:var(--surface-2)}
.av img{width:100%;height:100%;object-fit:cover}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12.5px;color:var(--ink-soft);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{font-size:12px;color:var(--ink-soft);text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.row-end b{display:block;color:var(--accent);font-size:13px}

/* meeting card (date block) */
.gather{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left;width:100%}
.gather:active{transform:scale(.985)}
.dateb{flex:0 0 52px;text-align:center;background:var(--surface-2);border-radius:12px;padding:7px 4px;line-height:1.2}
.dateb b{display:block;font-family:var(--f-display);font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums}
.dateb span{font-size:10.5px;color:var(--ink-soft)}
.month{margin:18px 0 2px;font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink-soft)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--f-display);font-size:24px;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.stats span{font-size:11.5px;color:var(--ink-soft)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:14px}
.search svg{width:18px;height:18px;color:var(--ink-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:15px}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;min-height:52px;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(8px,env(safe-area-inset-left,0px))}
.tb-btn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight:500;font-size:14.5px;padding:0 6px;border-radius:12px}
.tb-title{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{min-width:44px;display:flex;justify-content:flex-end}
.tb-save{background:var(--btn);color:var(--btn-fg);border-radius:20px;padding:7px 16px;font-weight:700;font-size:14px}
.tb-save[disabled]{opacity:.5}

/* detail */
.p-hero{display:flex;flex-direction:column;gap:14px}
.p-hero-top{display:flex;gap:15px;align-items:center}
.p-name{margin:0;font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.3}
.p-role{font-size:13px;color:var(--on-hero-soft);font-weight:300}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;border-top:1px solid rgba(217,193,154,.25);padding-top:12px}
.p-stats b{display:block;font-family:var(--f-display);font-size:17px;color:var(--hero-gold);font-variant-numeric:tabular-nums}
.p-stats span{font-size:11px;color:var(--on-hero-soft)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-soft);font-size:12.5px;padding-top:2px}
.kv dd{margin:0;min-width:0;white-space:pre-wrap;word-break:break-word}
.kv dd.warn{color:var(--warn-fg);font-weight:500}
.card-title{margin:0 0 10px;font-size:12.5px;letter-spacing:1px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.para{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.75}
.contact{display:flex;align-items:center;gap:10px;padding:8px 0}
.contact+.contact{border-top:1px solid var(--line)}
.contact .val{flex:1;min-width:0;font-variant-numeric:tabular-nums;user-select:all;word-break:break-all}
.contact .lbl2{font-size:12px;color:var(--ink-soft);width:44px;flex:0 0 auto}
.mini-btn{font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px}
.mini-btn svg{width:14px;height:14px}

.note{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note-d{flex:0 0 auto;font-size:11.5px;color:var(--gold);font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums}
.note-t{flex:1;min-width:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.note-x{color:var(--ink-soft);font-size:11.5px;flex:0 0 auto}
.note-add{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.note-add textarea{flex:1;min-width:0}

/* AI brief */
.brief{border:1px solid var(--gold-line);background:var(--surface)}
.brief h4{margin:14px 0 6px;font-size:12.5px;color:var(--gold);letter-spacing:.5px}
.brief ul{margin:0;padding-left:18px;font-size:14px;line-height:1.75}
.talk{background:var(--surface-2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:11px 14px;font-size:14px;line-height:1.7;margin-top:8px}
.ai-note{display:flex;gap:8px;align-items:center;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--gold-bg);color:var(--ink)}
.ai-note svg{width:17px;height:17px;color:var(--gold)}
.ai-note.err{background:var(--warn-bg);color:var(--warn-fg)}
.ai-note.busy svg{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* forms */
.form{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.fgroup{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.fgroup-title{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-width:0}
textarea.inp{resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--ink-soft);opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13.5px;color:var(--ink-soft);font-weight:500}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stars{display:flex;gap:4px}
.stars button{font-size:26px;line-height:1;color:var(--line)}
.stars button.on{color:var(--gold)}
.stars-txt{color:var(--gold);letter-spacing:1.5px;font-size:13px}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:#5c1f2e}

.ph-row{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.ph-x svg{width:14px;height:14px}
.ph-add{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--gold-line);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer}
.ph-add.off{opacity:.5;cursor:not-allowed}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;max-width:100%}
.namecard{display:flex;gap:8px;flex-wrap:wrap}
.namecard img{width:calc(50% - 4px);aspect-ratio:1.7;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;max-width:100%}

/* wines */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.wimg{aspect-ratio:3/4;background:var(--surface-2);display:flex;align-items:center;justify-content:center;max-width:100%}
.wimg img{width:100%;height:100%;object-fit:cover}
.wimg svg{width:56px;height:56px;stroke-width:1.2}
.wbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wname{font-weight:700;font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{font-size:12px;color:var(--ink-soft)}
.w-hero-img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--surface-2);border-radius:18px;cursor:zoom-in}
.wine-mini{display:flex;gap:10px;align-items:center;padding:8px 0;text-align:left;width:100%}
.wine-mini .thumb{width:40px;height:52px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.wine-mini .thumb img{width:100%;height:100%;object-fit:cover}
.wine-mini .thumb svg{width:24px;height:24px}

/* group cards */
.gcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.av-stack{display:flex}
.av-stack .av{border:2px solid var(--surface);margin-left:-8px}
.av-stack .av:first-child{margin-left:0}

/* tab bar + fab */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--tab-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{max-width:520px;margin:0 auto;display:flex;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:62px;color:var(--ink-soft);font-size:10.5px;font-weight:500}
.tab.on{color:var(--accent);font-weight:700}
.tab.on svg{stroke-width:2}
#fab{position:fixed;z-index:26;right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100vw - 520px) / 2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(63,20,32,.35)}
#fab svg{width:26px;height:26px;stroke-width:2}

/* overlays */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet h3{margin:0 0 6px;font-family:var(--f-display);font-size:17px}
.sheet-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;background:var(--bg);text-align:left;font-weight:500}
.sheet-item svg{color:var(--accent)}
.sheet-item span{flex:1}
.sheet-item small{color:var(--ink-soft);font-weight:300;font-size:12px}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:#2a2320;color:#f8f2e9;padding:10px 18px;border-radius:30px;font-size:13.5px;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.no-tab #toast{bottom:calc(40px + env(safe-area-inset-bottom,0px))}

.empty{text-align:center;padding:28px 16px;color:var(--ink-soft);font-size:13.5px;line-height:1.7}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}
.steps{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.step{display:flex;gap:12px;align-items:flex-start;text-align:left}
.step-n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center}
.step h4{margin:2px 0 0;font-size:14.5px}
.step p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);font-weight:300}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--warn-bg);border-radius:16px;padding:14px;color:var(--warn-fg);font-size:13.5px}
.pick-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pick-box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent}
.pick-row.on .pick-box{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.pick-box svg{width:16px;height:16px;stroke-width:2.4}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <button id="fab" type="button" data-act="fab" aria-label="새로 기록하기" hidden></button>
  <nav id="tabbar" aria-label="메뉴"><div class="tabs" id="tabs"></div></nav>
</div>
<div id="overlay"></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const COLS = ["groups", "people", "meetings", "wines", "gifts"];
const KIND_COL = { person: "people", meeting: "meetings", wine: "wines", gift: "gifts", group: "groups" };
const TODAY = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const parseD = (s) => { if (!s || typeof s !== "string") return null; const [y, m, d] = s.split("-").map(Number); if (!y || !m || !d) return null; return new Date(y, m - 1, d); };
const daysAgo = (s) => { const d = parseD(s); if (!d) return null; return Math.round((parseD(TODAY()) - d) / 86400000); };
const fmtD = (s, withYear) => { const d = parseD(s); if (!d) return ""; const y = d.getFullYear(); return (withYear || y !== new Date().getFullYear() ? y + "년 " : "") + (d.getMonth() + 1) + "월 " + d.getDate() + "일"; };
const rel = (s) => { const n = daysAgo(s); if (n == null) return "기록 없음"; if (n === 0) return "오늘"; if (n === 1) return "어제"; if (n < 0) return -n + "일 후"; if (n < 30) return n + "일 전"; if (n < 365) return Math.floor(n / 30) + "개월 전"; return Math.floor(n / 365) + "년 전"; };
const bdayIn = (s) => { const d = parseD(s); if (!d) return null; const t = parseD(TODAY()); let nx = new Date(t.getFullYear(), d.getMonth(), d.getDate()); if (nx < t) nx = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate()); return Math.round((nx - t) / 86400000); };
const won = (n) => (n === "" || n == null || isNaN(Number(n))) ? "" : Number(n).toLocaleString("ko-KR") + "원";
const byDateDesc = (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.createdAt || 0) - (a.createdAt || 0);
const PHOTO_URL = new Map();
const blob = (id) => PHOTO_URL.get(id) || "";
const stars = (n) => { n = Math.round(Number(n) || 0); return n ? "★".repeat(n) + "☆".repeat(5 - n) : ""; };
const clone = (o) => JSON.parse(JSON.stringify(o || {}));

const IC = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  people: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  groups: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M15.5 15.4c2.6-.3 5 1.4 5 4.2"/></svg>',
  records: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>',
  wine: '<svg viewBox="0 0 24 24"><path d="M7 3h10c.4 5-1.6 8.6-5 9.4C8.6 11.6 6.6 8 7 3z"/><path d="M12 12.4V20M8.5 21h7"/><path d="M7.3 7.5h9.4"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
  camera: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
  gift: '<svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13"/><path d="M12 7C10 4 7 4 7 6s3 1 5 1zM12 7c2-3 5-3 5-1s-3 1-5 1z"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cake: '<svg viewBox="0 0 24 24"><path d="M4 21h16v-8H4z"/><path d="M4 16.5c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 4 0"/><path d="M12 13V9.5"/><path d="M12 7c-1-1 0-3 0-3s1 2 0 3z"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
};
const glass = (type) => { const col = { "레드": "#7a3a49", "화이트": "#d9c19a", "로제": "#d99aa5", "스파클링": "#e0cf8f", "디저트": "#c08a3e", "주정강화": "#6e3b2a" }[type] || "#b8935a"; return `<svg viewBox="0 0 24 24" style="color:${col}"><path d="M7 3h10c.4 5-1.6 8.6-5 9.4C8.6 11.6 6.6 8 7 3z" fill="currentColor" fill-opacity=".35"/><path d="M12 12.4V20M8.5 21h7"/></svg>`; };

/* ---------- options ---------- */
const CLOSE = ["아주 가까움", "가까움", "알고 지냄", "처음 만남"];
const GROUP_CAT = ["친구", "가족", "동창", "직장", "취미", "비즈니스", "기타"];
const CYCLE = ["매주", "매월", "분기", "반기", "1년", "비정기"];
const CUISINE = ["한식", "일식", "중식", "양식", "이탈리안", "프렌치", "아시안", "기타"];
const PLACE_RATE = ["또 갈래요", "괜찮음", "별로"];
const PAY = ["내가 냄", "상대가 냄", "나눠 냄"];
const WTYPE = ["레드", "화이트", "로제", "스파클링", "디저트", "주정강화"];
const OCCASION = ["생일", "명절", "결혼·출산", "입학·졸업", "승진·축하", "감사", "여행 선물", "조의", "기타"];
const DEFAULTS = {
  person: () => ({ name: "", groupIds: [], closeness: "", company: "", title: "", phone: "", email: "", birthday: "", address: "", cardIds: [], cardInfo: "", photoId: "", education: "", career: "", spouse: "", kids: "", kidsNotes: "", likes: "", wineTaste: "", avoid: "", memo: "", notes: [] }),
  meeting: () => ({ title: "", date: TODAY(), groupId: "", personIds: [], place: "", cuisine: "", food: "", wineIds: [], photoIds: [], placeRating: "", payment: "", talk: "", nextTime: "" }),
  wine: () => ({ name: "", labelId: "", type: "", winery: "", vintage: "", grapes: "", country: "", region: "", vivino: "", myRating: 0, price: "", shop: "", vivinoUrl: "", about: "", notes: "", again: false }),
  gift: () => ({ title: "", date: TODAY(), personIds: [], direction: "given", occasion: "", price: "", memo: "", needReturn: false, photoId: "" }),
  group: () => ({ name: "", category: "", cycle: "", desc: "" }),
};

/* ---------- state ---------- */
const S = { groups: new Map(), people: new Map(), meetings: new Map(), wines: new Map(), gifts: new Map(), settings: {}, loaded: new Set(), db: null, dbState: "loading", assets: null, sample: null, sampleImages: false, downloads: null };
const LS = { pq: "", pg: "", psort: "recent", wq: "", wt: "", rec: "meet" };
let tab = "home";
let stack = [{ name: "home" }];
const cur = () => stack[stack.length - 1];
const ROOTS = ["home", "people", "groups", "records", "wines"];
const isFormLike = (c) => /Form$/.test(c.name) || c.name === "pick" || c.name === "settings";

/* ---------- navigation ---------- */
function go(name, params = {}) { stack.push({ name, ...params }); try { history.pushState({ d: stack.length }, ""); } catch { /* ignore */ } render(true); }
function doBack() { const c = cur(); if (/Form$/.test(c.name) && c.newPhotos) for (const id of c.newPhotos) removePhoto(id); if (stack.length > 1) { stack.pop(); render(true); } }
function back() { if (stack.length <= 1) return; if (history.state && history.state.d) history.back(); else doBack(); }
function switchTab(t) { tab = t; stack = [{ name: t }]; render(true); }
function openForm(kind, base, extra = {}) {
  const d = Object.assign(DEFAULTS[kind](), clone(base || {}));
  const id = d.id || null; delete d.id;
  go(kind + "Form", { draft: d, id, orig: clone(d), ...extra });
}

/* ---------- derived index ---------- */
function idx() {
  const meetByPerson = new Map(), wineMeets = new Map(), meetByGroup = new Map();
  const meets = [...S.meetings.values()].sort(byDateDesc);
  for (const m of meets) {
    for (const pid of m.personIds || []) { if (!meetByPerson.has(pid)) meetByPerson.set(pid, []); meetByPerson.get(pid).push(m); }
    for (const w of m.wineIds || []) { if (!wineMeets.has(w)) wineMeets.set(w, []); wineMeets.get(w).push(m); }
    if (m.groupId) { if (!meetByGroup.has(m.groupId)) meetByGroup.set(m.groupId, []); meetByGroup.get(m.groupId).push(m); }
  }
  const lastMet = (pid) => (meetByPerson.get(pid) || [])[0]?.date || null;
  return { meets, meetByPerson, wineMeets, meetByGroup, lastMet };
}
const pname = (id) => S.people.get(id)?.name || "";
const names = (ids, max = 3) => { const n = (ids || []).map(pname).filter(Boolean); return n.length > max ? n.slice(0, max).join(", ") + " 외 " + (n.length - max) + "명" : n.join(", "); };
const membersOf = (gid) => [...S.people.values()].filter((p) => (p.groupIds || []).includes(gid));

/* ---------- small renderers ---------- */
const AV = [["#7a3a49", "#4a1826"], ["#4a6a5a", "#243a30"], ["#a97f45", "#6e4e24"], ["#5a5a7a", "#2f2f48"], ["#8a5a3a", "#4e2f1a"]];
function avatar(p, size = 46) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px`;
  if (p?.photoId) return `<span class="av" style="${st}"><img src="${blob(p.photoId)}" alt="" loading="lazy"></span>`;
  const nm = String(p?.name || "?").replace(/^\(예시\)\s*/, "");
  let h = 0; for (const ch of nm) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const [a, b] = AV[h % AV.length];
  return `<span class="av" style="${st};background:linear-gradient(135deg,${a},${b})">${esc([...nm][0] || "?")}</span>`;
}
function head(eyebrow, title, sub, right = "") {
  return `<header class="head"><div class="head-row"><p class="eyebrow">${eyebrow}</p>${right}</div><h1 class="h-title">${title}</h1>${sub ? `<p class="h-sub">${sub}</p>` : ""}</header>`;
}
function topbar(title, right = "") {
  return `<div class="topbar"><button class="tb-btn" type="button" data-act="back" aria-label="뒤로">${IC.back}</button><span class="tb-title">${esc(title)}</span><span class="tb-right">${right}</span></div>`;
}
function formbar(title, c) {
  return `<div class="topbar"><button class="tb-btn" type="button" data-act="back">취소</button><span class="tb-title">${esc(title)}</span><span class="tb-right"><button class="tb-save" type="button" data-act="save" ${c.saving || c.uploading ? "disabled" : ""}>${c.saving ? "저장 중" : "저장"}</button></span></div>`;
}
function gather(m) {
  const d = parseD(m.date); const g = S.groups.get(m.groupId);
  const wines = (m.wineIds || []).map((id) => S.wines.get(id)?.name).filter(Boolean);
  const sub = [names(m.personIds, 3), m.place].filter(Boolean).join(" · ");
  return `<button class="gather" type="button" data-act="go" data-screen="meeting" data-id="${esc(m.id)}">
    <div class="dateb"><b>${d ? d.getDate() : "–"}</b><span>${d ? d.getMonth() + 1 + "월 " + WD[d.getDay()] : ""}</span></div>
    <div class="row-main"><div class="row-title">${esc(m.title || "만남")}</div>
    <div class="row-sub">${esc(sub || (g ? g.name : ""))}</div>
    ${wines.length ? `<div class="row-sub" style="color:var(--gold)">🍷 ${esc(wines.join(", "))}</div>` : ""}</div></button>`;
}
function personRow(p, end = "") {
  const sub = [p.company, p.title].filter(Boolean).join(" · ") || (p.groupIds || []).map((id) => S.groups.get(id)?.name).filter(Boolean).join(", ");
  return `<button class="row" type="button" data-act="go" data-screen="person" data-id="${esc(p.id)}">${avatar(p, 44)}<div class="row-main"><div class="row-title">${esc(p.name || "이름 없음")}</div><div class="row-sub">${esc(sub)}</div></div>${end}</button>`;
}
function wineMini(w) {
  return `<button class="wine-mini" type="button" data-act="go" data-screen="wine" data-id="${esc(w.id)}"><span class="thumb">${w.labelId ? `<img src="${blob(w.labelId)}" alt="" loading="lazy">` : glass(w.type)}</span><span class="row-main"><span class="row-title" style="display:block">${esc(w.name || "이름 없는 와인")}</span><span class="row-sub" style="display:block">${esc([w.vintage, w.type, w.country].filter(Boolean).join(" · "))}</span></span><span class="stars-txt">${stars(w.myRating)}</span></button>`;
}
function giftRow(g) {
  const given = g.direction !== "received";
  return `<button class="row" type="button" data-act="editGift" data-id="${esc(g.id)}"><span class="av" style="width:44px;height:44px;background:var(--gold-bg);color:var(--gold)">${IC.gift}</span><div class="row-main"><div class="row-title">${esc(g.title || "선물")}</div><div class="row-sub">${given ? "준 선물" : "받은 선물"} · ${esc(names(g.personIds, 2) || "받는 사람 없음")}${g.occasion ? " · " + esc(g.occasion) : ""}</div></div><div class="row-end">${esc(fmtD(g.date))}${g.needReturn ? `<b>답례 필요</b>` : g.price ? `<b>${esc(won(g.price))}</b>` : ""}</div></button>`;
}
function empty(title, text, btn = "") { return `<div class="empty"><b>${title}</b>${text}${btn ? `<div style="margin-top:14px">${btn}</div>` : ""}</div>`; }
function blocked() {
  if (S.dbState === "ok") return "";
  if (S.dbState === "err") return `<div class="stack"><div class="quiet"><b>이 브라우저에서는 기록을 저장할 수 없어요.</b> 시크릿(개인정보 보호) 모드라면 일반 모드로 열어 주세요. 앱을 설치해서 열면 가장 안전해요.</div></div>`;
  return `<div class="empty"><b>기록을 불러오는 중이에요</b>잠시만 기다려 주세요.</div>`;
}
const missing = () => empty("찾을 수 없어요", "삭제되었거나 아직 불러오지 못한 기록이에요.");

/* ---------- screens ---------- */
const SC = {};

SC.home = () => {
  const now = new Date(); const nm = String(S.settings.name || "").trim();
  const eb = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 · ${WD[now.getDay()]}요일`;
  const title = nm ? `${esc(nm)} 님,<br>오늘도 조용히, 그러나 깊게.` : "오늘도 조용히,<br>그러나 깊게.";
  let h = head(eb, title, "", `<button class="icon-btn" type="button" data-act="go" data-screen="settings" aria-label="설정">${IC.gear}</button>`);
  const bl = blocked(); if (bl) return h + bl;
  const I = idx(); const people = [...S.people.values()];
  if (!people.length && !S.meetings.size && !S.wines.size) return h + welcome();

  const bdays = people.filter((p) => p.birthday).map((p) => ({ p, n: bdayIn(p.birthday) })).filter((x) => x.n != null && x.n <= 30).sort((a, b) => a.n - b.n);
  const follow = I.meets.filter((m) => String(m.nextTime || "").trim() && (daysAgo(m.date) ?? 999) <= 180 && (daysAgo(m.date) ?? -1) >= 0).map((m) => ({ m, p: (m.personIds || []).map((id) => S.people.get(id)).find(Boolean) })).filter((x) => x.p);
  const longNo = people.filter((p) => CLOSE.slice(0, 2).includes(p.closeness)).map((p) => ({ p, d: I.lastMet(p.id) })).filter((x) => !x.d || daysAgo(x.d) > 60).sort((a, b) => (a.d || "").localeCompare(b.d || "")).slice(0, 4);
  const recent = I.meets.slice(0, 3);
  const toReturn = [...S.gifts.values()].filter((g) => g.needReturn).sort(byDateDesc);
  const m30 = I.meets.filter((m) => { const n = daysAgo(m.date); return n != null && n >= 0 && n <= 30; }).length;

  let quiet;

};

SC.people = () => {
  const bl = blocked();
  let h = head("PEOPLE", "사람", bl ? "" : `${S.people.size}명을 기억하고 있어요`);
  if (bl) return h + bl;
  const groups = [...S.groups.values()].sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
  h += `<label class="search">${IC.search}<input id="pq" type="search" data-q="pq" placeholder="이름, 회사, 메모로 찾기" value="${esc(LS.pq)}" autocomplete="off"></label>`;
  h += `<div class="chips scroll" style="margin-top:12px"><button class="chip ${LS.pg ? "" : "on"}" type="button" data-act="pg" data-v="">전체</button>${groups.map((g) => `<button class="chip ${LS.pg === g.id ? "on" : ""}" type="button" data-act="pg" data-v="${esc(g.id)}">${esc(g.name)}</button>`).join("")}</div>`;
  h += `<div class="seg" style="margin-top:12px"><button type="button" class="${LS.psort === "recent" ? "on" : ""}" data-act="psort" data-v="recent">최근 만남순</button><button type="button" class="${LS.psort === "name" ? "on" : ""}" data-act="psort" data-v="name">이름순</button><button type="button" class="${LS.psort === "group" ? "on" : ""}" data-act="psort" data-v="group">모임 이름순</button></div>`;
  h += `<div class="card flat" style="padding:2px 16px;margin-top:12px" id="people-list">${peopleList()}</div>`;
  return h;
};
function peopleList() {
  const I = idx(); const q = LS.pq.trim().toLowerCase();
  let list = [...S.people.values()];
  if (LS.pg) list = list.filter((p) => (p.groupIds || []).includes(LS.pg));
  if (q) list = list.filter((p) => [p.name, p.company, p.title, p.memo, p.likes, p.kids, p.education, p.career].some((v) => String(v || "").toLowerCase().includes(q)));
  if (LS.psort === "name") list.sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
  else if (LS.psort === "group") list.sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
  else list.sort((a, b) => String(I.lastMet(b.id) || "").localeCompare(String(I.lastMet(a.id) || "")) || String(a.name).localeCompare(String(b.name), "ko"));
  if (!list.length) return S.people.size ? empty("찾는 사람이 없어요", "검색어나 모임 필터를 바꿔 보세요.") : empty("아직 등록한 사람이 없어요", "오른쪽 아래 + 버튼으로 첫 사람을 추가해 보세요.");
  const row = (p) => { const d = I.lastMet(p.id); return personRow(p, `<div class="row-end">${d ? "마지막 만남" : ""}<b>${esc(rel(d))}</b></div>`); };
  if (LS.psort === "group") {
    const head = (t, n) => `<p class="month" style="margin:16px 0 0">${esc(t)} <span style="font-family:var(--f-body);font-size:12px;font-weight:400">${n}명</span></p>`;
    const groups = [...S.groups.values()].filter((g) => !LS.pg || g.id === LS.pg).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
    let out = "";
    for (const g of groups) { const mem = list.filter((p) => (p.groupIds || []).includes(g.id)); if (mem.length) out += head(g.name, mem.length) + mem.map(row).join(""); }
    const none = list.filter((p) => !(p.groupIds || []).some((id) => S.groups.has(id)));
    if (none.length && !LS.pg) out += head("모임 없음", none.length) + none.map(row).join("");
    return out;
  }
  return list.map(row).join("");
}

function wineList(I = idx()) {
  const q = LS.wq.trim().toLowerCase();

const fText = (label, f, d, ph = "", type = "text", attrs = "") => `<label class="field"><span class="lbl">${label}</span><input class="inp" id="f-${f}" data-f="${f}" type="${type}" value="${esc(d[f] ?? "")}" placeholder="${esc(ph)}" ${attrs}></label>`;
const fArea = (label, f, d, ph = "", rows = 3) => `<label class="field"><span class="lbl">${label}</span><textarea class="inp" id="f-${f}" data-f="${f}" rows="${rows}" placeholder="${esc(ph)}">${esc(d[f] ?? "")}</textarea></label>`;
const fChips = (label, f, d, opts, extra = "") => `<div class="field"><span class="lbl">${label}</span><div class="chips">${opts.map((o) => { const [v, t] = Array.isArray(o) ? o : [o, o]; const on = Array.isArray(d[f]) ? d[f].includes(v) : d[f] === v; return `<button class="chip ${on ? "on" : ""}" type="button" data-act="chip" data-f="${f}" data-v="${esc(v)}">${esc(t)}</button>`; }).join("")}${extra}</div></div>`;
function photoField(label, f, d, c, { multi = false, max = 6, scan = "" } = {}) {
  const ids = multi ? d[f] || [] : d[f] ? [d[f]] : [];
  const can = true;
  const addBtn = (multi ? ids.length < max : !ids.length) ? (can ? `<label class="ph-add">${IC.camera}<span>${c.uploading ? "올리는 중…" : "사진"}</span><input type="file" accept="image/*" ${multi ? "multiple" : ""} data-up="${f}" ${scan ? `data-scan="${scan}"` : ""} hidden></label>` : `<span class="ph-add off">${IC.camera}<span>사진</span></span>`) : "";
  return `<div class="field"><span class="lbl">${label}</span><div class="ph-row">${ids.map((id, i) => `<div class="ph"><img src="${blob(id)}" alt="" data-act="zoom" data-src="${blob(id)}"><button type="button" class="ph-x" data-act="phDel" data-f="${f}" data-i="${i}" aria-label="사진 빼기">${IC.x}</button></div>`).join("")}${addBtn}</div>${can ? "" : `<p class="hint">사진을 올리려면 이 앱을 '편집자' 권한으로 공유받아야 해요.</p>`}</div>`;
}
function scanNote(c, kind) {
  const what = kind === "card" ? "명함" : "라벨";
  if (!aiOn()) return `<p class="hint">${IC.spark} 설정에서 Anthropic API 키를 넣으면 ${what} 사진으로 빈칸을 자동으로 채울 수 있어요.</p>`;
  const st = c.scan || "";
  if (st === "busy") return `<div class="ai-note busy">${IC.spark} ${what}을 읽는 중이에요…</div>`;
  if (st.startsWith("done:")) return `<div class="ai-note">${IC.spark} ${esc(st.slice(5))}을(를) 채웠어요. 맞는지 확인해 주세요.</div>`;
  if (st === "none") return `<div class="ai-note">${IC.spark} 새로 채울 항목을 찾지 못했어요. 빈칸만 채우고 이미 쓴 내용은 그대로 둬요.</div>`;
  if (st.startsWith("err:")) return `<div class="ai-note err">${esc(st.slice(4))}</div>${c.scanBlob ? `<button class="btn ghost small" type="button" data-act="scan" data-kind="${kind}">다시 읽기</button>` : ""}`;
  return `<p class="hint">${IC.spark} ${kind === "card" ? "명함 사진을 올리면 AI가 이름·회사·직함·연락처를 읽어 빈칸을 채워요." : "라벨 사진을 올리면 AI가 와인 이름·빈티지·품종·산지를 읽어 빈칸을 채워요."}</p>`;
}
function pickSummary(label, ids, map, act, field, emptyTxt) {
  const items = (ids || []).map((id) => map.get(id)).filter(Boolean);
  return `<div class="field"><span class="lbl">${label}</span><div class="chips">${items.map((x) => `<span class="chip">${esc(x.name || x.title || "")}</span>`).join("")}<button class="chip add" type="button" data-act="${act}" data-f="${field}">${items.length ? "바꾸기" : "+ 고르기"}</button></div>${items.length ? "" : emptyTxt ? `<p class="hint">${emptyTxt}</p>` : ""}</div>`;
}
function delBlock(c, what) {

/* ---------- local store: records and photos stay on this device (IndexedDB) ---------- */
const APP_VERSION = "1.0.0";
const DB_NAME = "midam";
const STORES = [...COLS, "settings", "photos"];
let idb = null;
const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = (t) => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("abort")); });
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
  });
}
const Store = {
  async entries(store) { const st = idb.transaction(store).objectStore(store); const [keys, vals] = await Promise.all([reqP(st.getAllKeys()), reqP(st.getAll())]); return keys.map((k, i) => [k, vals[i]]); },
  get: (store, key) => reqP(idb.transaction(store).objectStore(store).get(key)),
  put(store, key, val) { const t = idb.transaction(store, "readwrite"); t.objectStore(store).put(val, key); return txDone(t); },
  del(store, key) { const t = idb.transaction(store, "readwrite"); t.objectStore(store).delete(key); return txDone(t); },
  replaceAll(data) { const t = idb.transaction(STORES, "readwrite"); for (const s of STORES) { const st = t.objectStore(s); st.clear(); for (const [k, v] of data[s] || []) st.put(v, k); } return txDone(t); },
};
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function saveDoc(col, id, body) { await Store.put(col, id, body); S[col].set(id, { id, ...body }); }
async function patchDoc(col, id, patch) { const old = S[col].get(id); if (!old) return; const { id: _drop, ...rest } = old; await saveDoc(col, id, { ...rest, ...patch, updatedAt: Date.now() }); }
async function removeDoc(col, id) { await Store.del(col, id); S[col].delete(id); }
async function addPhoto(b) { const id = newId(); await Store.put("photos", id, b); PHOTO_URL.set(id, URL.createObjectURL(b)); return id; }
async function removePhoto(id) { await Store.del("photos", id).catch(() => {}); const u = PHOTO_URL.get(id); if (u) URL.revokeObjectURL(u); PHOTO_URL.delete(id); }
const photoIdsOf = (d) => [d?.photoId, d?.labelId, ...(d?.cardIds || []), ...(d?.photoIds || [])].filter(Boolean);
async function loadAll() {
  for (const col of COLS) { const m = new Map(); for (const [k, v] of await Store.entries(col)) m.set(k, { id: k, ...v }); S[col] = m; S.loaded.add(col); }
  S.settings = (await Store.get("settings", "main")) || {};
  S.aiKey = (await Store.get("settings", "aiKey")) || "";
  for (const u of PHOTO_URL.values()) URL.revokeObjectURL(u);
  PHOTO_URL.clear();
  for (const [k, b] of await Store.entries("photos")) if (b instanceof Blob) PHOTO_URL.set(k, URL.createObjectURL(b));
}

const AI_MODEL = "claude-opus-5-5";

let Anthropic = null, aiClient = null, aiClientKey = "";
async function loadSDK() { if (!Anthropic) Anthropic = (await import(SDK_URL)).default; return Anthropic; }
async function aiClientGet() {
  if (!S.aiKey) throw { code: "no_key" };
  await loadSDK();
  if (!aiClient || aiClientKey !== S.aiKey) { aiClient = new Anthropic({ apiKey: S.aiKey, dangerouslyAllowBrowser: true, maxRetries: 1 }); aiClientKey = S.aiKey; }

function aiCode(e) {
  if (!Anthropic || !(e instanceof Anthropic.APIError)) return e?.code || (e?.name === "AbortError" ? "cancelled" : Anthropic ? "upstream_error" : "offline");

  if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) return "bad_key";
  if (e instanceof Anthropic.RateLimitError) return "rate_limited";

async function shrink(file, max = 1600, q = 0.85) {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res) => cv.toBlob((b) => res(b || file), "image/jpeg", q));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}

  tab: (el) => switchTab(el.dataset.tab),
  go: (el) => {
    if (el.dataset.screen === "settings") { if (S.dbState !== "ok") return toast("기록을 불러온 뒤에 열 수 있어요"); go("settings", { draft: { name: S.settings.name || "", aiKey: S.aiKey || "" } }); return; }
    go(el.dataset.screen, { id: el.dataset.id });
  },
  fab: () => { if (tab === "people") openForm("person"); else if (tab === "groups") openForm("group"); else if (tab === "records") openForm(LS.rec === "gift" ? "gift" : "meeting"); else if (tab === "wines") openForm("wine"); else sheet(); },
  closeOverlay: (el, e) => { if (e.target === el) closeOverlay(); },
  new: (el) => { closeOverlay(); if (S.dbState !== "ok") return toast("기록을 불러온 뒤에 추가할 수 있어요"); openForm(el.dataset.kind); },
  zoom: (el, e) => { e.stopPropagation(); $("#overlay").innerHTML = `<div id="viewer" data-act="closeOverlay"><img src="${esc(el.dataset.src)}" alt="" data-act="closeOverlay"></div>`; },
  pg: (el) => { LS.pg = el.dataset.v; render(false); },
  psort: (el) => { LS.psort = el.dataset.v; render(false); },
  wt: (el) => { LS.wt = el.dataset.v; render(false); },
  recSeg: (el) => { LS.rec = el.dataset.v; render(false); },
  editPerson: (el) => openForm("person", { ...S.people.get(el.dataset.id) }),
  editGroup: (el) => openForm("group", { ...S.groups.get(el.dataset.id) }),
  editMeeting: (el) => openForm("meeting", { ...S.meetings.get(el.dataset.id) }),
  editWine: (el) => openForm("wine", { ...S.wines.get(el.dataset.id) }),
  editGift: (el) => openForm("gift", { ...S.gifts.get(el.dataset.id) }),
  newMeetingFor: (el) => { const p = S.people.get(el.dataset.id); openForm("meeting", { personIds: [el.dataset.id], groupId: (p?.groupIds || []).find((g) => S.groups.has(g)) || "" }); },
  newMeetingGroup: (el) => openForm("meeting", { groupId: el.dataset.id }),
  newGiftFor: (el) => openForm("gift", { personIds: [el.dataset.id] }),
  newGroupInline: () => openForm("group", {}, { returnTo: "groupIds" }),
  save: () => (cur().name === "settings" ? saveSettings(cur()) : saveForm()),
  delAsk: () => { cur().confirmDel = true; render(false); },
  delNo: () => { cur().confirmDel = false; render(false); },
  delYes: () => deleteCurrent(),
  chip: (el) => { const c = cur(); const f = el.dataset.f, v = el.dataset.v; if (!c.draft) return; if (Array.isArray(c.draft[f])) { const a = c.draft[f]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); } else c.draft[f] = c.draft[f] === v && !el.dataset.keep ? "" : v; render(false); },
  star: (el) => { const c = cur(); const n = Number(el.dataset.v); c.draft.myRating = c.draft.myRating === n ? 0 : n; render(false); },
  phDel: (el, e) => {
    e.stopPropagation(); const c = cur(); const f = el.dataset.f;
    const removed = Array.isArray(c.draft[f]) ? c.draft[f].splice(Number(el.dataset.i), 1)[0] : c.draft[f];
    if (!Array.isArray(c.draft[f])) c.draft[f] = "";
    if (removed && (c.newPhotos || []).includes(removed)) { removePhoto(removed); c.newPhotos = c.newPhotos.filter((x) => x !== removed); }
    render(false);
  },
  scan: (el) => runScan(cur(), el.dataset.kind),
  pickPeople: (el) => go("pick", { kind: "people", field: el.dataset.f, sel: new Set(cur().draft[el.dataset.f] || []), q: "" }),
  pickWines: (el) => go("pick", { kind: "wines", field: el.dataset.f, sel: new Set(cur().draft[el.dataset.f] || []), q: "" }),
  pickMembers: (el) => { const gid = el.dataset.id; go("pick", { kind: "people", mode: "group", groupId: gid, sel: new Set(membersOf(gid).map((p) => p.id)), q: "" }); },
  pickToggle: (el) => { const c = cur(); const id = el.dataset.id; c.sel.has(id) ? c.sel.delete(id) : c.sel.add(id); el.classList.toggle("on", c.sel.has(id)); },
  pickNew: () => { const c = cur(); openForm(c.kind === "wines" ? "wine" : "person", {}, { returnTo: "pick" }); },
  pickDone: async () => {
    const c = cur();
    if (c.mode === "group") {
      const gid = c.groupId; let n = 0;
      try { for (const p of [...S.people.values()]) { const has = (p.groupIds || []).includes(gid); const want = c.sel.has(p.id); if (has !== want) { const groupIds = want ? [...(p.groupIds || []), gid] : (p.groupIds || []).filter((g) => g !== gid); await patchDoc("people", p.id, { groupIds }); n++; } } toast(n ? "멤버를 바꿨어요" : "바뀐 멤버가 없어요"); }
      catch (e) { toast(dbErr(e)); }
      back(); return;
    }
    const prev = stack[stack.length - 2]; if (prev?.draft) prev.draft[c.field] = [...c.sel]; back();
  },
  copy: (el) => { const v = el.dataset.v; const ok = () => toast("복사했어요"); try { navigator.clipboard.writeText(v).then(ok, () => toast(v)); } catch { toast(v); } },
  addNote: async (el) => {
    const t = String($("#note-new")?.value || "").trim(); if (!t) return toast("메모를 입력해 주세요");
    const p = S.people.get(el.dataset.id); if (!p) return;
    el.disabled = true;
    try { await patchDoc("people", p.id, { notes: [{ d: TODAY(), t }, ...(p.notes || [])] }); $("#note-new").value = ""; document.activeElement?.blur?.(); toast("메모를 남겼어요"); render(false); }
    catch (e) { el.disabled = false; toast(dbErr(e)); }
  },
  delNote: async (el) => {
    const c = cur(); const i = Number(el.dataset.i);
    if (c.delNote !== i) { c.delNote = i; render(false); return; }
    const p = S.people.get(el.dataset.id); if (!p) return;
    try { await patchDoc("people", p.id, { notes: (p.notes || []).filter((_, j) => j !== i) }); c.delNote = null; render(false); } catch (e) { toast(dbErr(e)); }
  },
  brief: (el) => runBrief(el.dataset.id),
  briefStop: () => briefCtl?.abort(),
  backupSave: async () => {
    try {
      const file = await buildBackup();
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000); toast("백업 파일을 저장했어요");
    } catch (e) { toast("백업 파일을 만들지 못했어요"); }
  },
  backupShare: async () => {
    try { const file = await buildBackup(); await navigator.share({ files: [file], title: "미담 백업" }); toast("백업 파일을 보냈어요"); }
    catch (e) { if (e?.name !== "AbortError") toast("백업 파일을 보내지 못했어요"); }
  },
  importNo: () => { cur().importData = null; render(false); },
  importYes: async () => {
    const c = cur(); const d = c.importData; if (!d || c.importing) return;
    c.importing = true; render(false);
    try {
      const data = {};
      for (const col of COLS) data[col] = (d[col] || []).filter((o) => o && o.id).map(({ id, ...rest }) => [String(id), rest]);
      data.settings = [["main", d.settings || {}]]; if (S.aiKey) data.settings.push(["aiKey", S.aiKey]);
      data.photos = [];
      for (const [id, url] of Object.entries(d.photos || {})) { try { data.photos.push([id, await (await fetch(url)).blob()]); } catch { /* skip a broken photo */ } }
      await Store.replaceAll(data); await loadAll();
      toast("백업을 불러왔어요"); tab = "home"; stack = [{ name: "home" }]; render(true);
    } catch (e) { c.importing = false; toast(dbErr(e)); render(false); }
  },
  aiTest: async () => {
    const c = cur(); const key = String(c.draft.aiKey || "").trim();
    if (!key) return toast("API 키를 먼저 넣어 주세요");
    c.aiTest = "busy"; render(false);
    try { const SDK = await loadSDK(); await new SDK({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 0 }).models.retrieve(AI_MODEL); c.aiTest = "ok"; }
    catch (e) { c.aiTest = "err:" + aiErr(aiCode(e)); }
    if (cur() === c) render(false);
  },
  aiClear: () => { const c = cur(); c.draft.aiKey = ""; c.aiTest = ""; render(false); },
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch { /* ignore */ } installEvt = null; render(false); },
  hideInstall: () => { LS.hideInstall = true; try { localStorage.setItem("midam.hideInstall", "1"); } catch { /* ignore */ } render(false); },
  seed: async () => {
    const now = Date.now();
    try { for (const [col, id, body] of examples()) await saveDoc(col, id, { ...body, createdAt: now, updatedAt: now }); toast("예시 기록을 넣었어요"); }
    catch (e) { toast(dbErr(e)); }
    render(true);
  },
  unseed: async () => {
    try { for (const col of COLS) for (const id of [...S[col].keys()]) if (id.startsWith("ex-")) await removeDoc(col, id); toast("예시 기록을 지웠어요"); }
    catch (e) { toast(dbErr(e)); }
    render(false);
  },
};
async function saveSettings(c) {
  const name = String(c.draft.name || "").trim(); const key = String(c.draft.aiKey || "").trim();
  if (key && !key.startsWith("sk-ant-")) return toast("Anthropic API 키는 sk-ant- 로 시작해요");
  c.saving = true; render(false);
  try {
    const body = { ...S.settings, name, updatedAt: Date.now() };
    await Store.put("settings", "main", body); S.settings = body;
    if (key !== S.aiKey) { if (key) await Store.put("settings", "aiKey", key); else await Store.del("settings", "aiKey"); S.aiKey = key; aiClient = null; }
    toast("저장했어요"); stack.pop(); render(true);
  } catch (e) { c.saving = false; toast(dbErr(e)); render(false); }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") return;
  fn(el, e);
});
const onField = (e) => {
  const t = e.target;
  if (t.dataset?.f) { const c = cur(); if (!c.draft) return; c.draft[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value; return; }
  const q = t.dataset?.q; if (!q) return;
  if (q === "pq") { LS.pq = t.value; const l = $("#people-list"); if (l) l.innerHTML = peopleList(); }
  else if (q === "wq") { LS.wq = t.value; const l = $("#wine-list"); if (l) l.innerHTML = wineList(); }
  else if (q === "pick") { const c = cur(); c.q = t.value; const l = $("#pick-list"); if (l) l.innerHTML = pickList(c); }
};
document.addEventListener("input", onField);
document.addEventListener("change", (e) => { if (e.target.dataset?.up) handleUpload(e.target); else if (e.target.dataset?.import) handleImport(e.target); else onField(e); });
document.addEventListener("error", (e) => { if (e.target && e.target.tagName === "IMG") e.target.classList.add("broken"); }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#overlay").innerHTML) closeOverlay(); });
window.addEventListener("popstate", () => { if ($("#overlay").innerHTML) { closeOverlay(); return; } if (stack.length > 1) doBack(); });

/* ---------- boot ---------- */
$("#fab").innerHTML = IC.plus;
try { LS.hideInstall = localStorage.getItem("midam.hideInstall") === "1"; } catch { /* ignore */ }
render(true);
(async () => {
  try {
    idb = await openDB();
    await loadAll();
    S.dbState = "ok";
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { console.error(e); S.dbState = "err"; }
  render(false);
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
})();
</script>
</body>
</html>
